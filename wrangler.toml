# Cloudflare deploy config for the BehaviorTree.java Academy (static site, no build step).
#
# The Pages/Workers Build runs `npx wrangler deploy` from the REPO ROOT (the build log proves
# it: "Processing /opt/buildhome/repo"), so this root-level config is the one wrangler reads.
# `directory = "./docs/learn"` serves the course as the static asset bundle (assets-only
# Worker, no build step).
#
# IMPORTANT: the `name` must EXACTLY match your Cloudflare project name (Workers & Pages →
# your project → Settings → Name). If your project is named something else, edit this line —
# otherwise wrangler will publish a brand-new worker instead of your existing one.
name = "behaviortree-academy"
compatibility_date = "2026-01-01"

[assets]
directory = "./docs/learn"
